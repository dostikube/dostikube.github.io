<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DostiKube presenter portal for GitOps in the Real World.">
  <meta name="theme-color" content="#061018">
  <title>DostiKube — Presenter Access</title>
  <link rel="canonical" href="https://dostikube.github.io/">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/core.js" defer></script>
</head>
<body class="access-page">
  <a class="skip" href="#main">Skip to access form</a>
  <main id="main" class="access-shell">
    <section class="access-card" aria-labelledby="access-title">
      <span class="brand-mark" aria-hidden="true"></span>
      <p class="eyebrow">Presenter portal</p>
      <h1 id="access-title">DOSTIKUBE</h1>
      <form id="access-form" class="access-form">
        <label for="access-code">Enter access code</label>
        <input id="access-code" name="access-code" type="password" autocomplete="current-password" required autofocus>
        <button class="btn" type="submit">Enter</button>
      </form>
      <p id="access-error" class="form-error" role="alert" aria-live="polite"></p>
      <p class="gate-disclosure">Client-side presentation gate. This is not secure authentication.</p>
    </section>
  </main>
  <script>addEventListener('DOMContentLoaded',()=>Dosti.initAccess())</script>
</body>
</html>
